# ════════════════════════════════════════════════════════════════════════
# Worker « armée de bots » — déploie des bots (comptes ANONYMES) qui jouent en
# ligne comme de vrais joueurs, pour tester le online solo. Piloté depuis le
# menu dev (table bot_army_control) ; rapport dans bot_army_report.
# Voir docs/BOT_ARMY_PLAN.md.
#
# ⚠ PRÉ-REQUIS (une fois, par Jonathan) :
#   • Activer l'AUTH ANONYME dans Supabase (Auth → Providers → Anonymous).
#   • Exécuter sql_a_executer/dev_bot_army.sql.
#   • Le secret repo SUPABASE_SERVICE_ROLE_KEY est DÉJÀ configuré (worker
#     d'équilibre) — rien à ajouter. La clé anon (publique) est lue dans
#     index.html par le worker au runtime.
#
# Le job est LONG (jusqu'à timeout-minutes) : une fois « enabled », il maintient
# les bots vivants et réactifs jusqu'à ce que la directive repasse à false
# (bouton Arrêter) ou que le temps du job expire. Le cron court capte un « start ».
# ════════════════════════════════════════════════════════════════════════
name: Bot army (test online)

on:
  # ⏱ Cron réactivé pour un « compagnon dispo » best-effort (backfill équipe des
  # 15) : toutes les 10 min, le worker se réveille et JOUE LA DIRECTIVE COURANTE.
  # La concurrency (groupe unique, cancel-in-progress=false) garantit UN SEUL
  # worker à la fois — plus de cohortes qui se chevauchent.
  #
  # 💸 COÛT GitHub Actions — le vrai garde-fou est la directive `enabled` :
  #   • enabled=FALSE (défaut) → chaque réveil vérifie la table et SORT en ~30 s
  #     (checkout + install + exit). Overhead léger, pas de partie jouée.
  #   • enabled=TRUE (bouton « Déployer » du menu dev) → le worker tourne jusqu'à
  #     BOT_ARMY_MINUTES (15 min en planifié) puis le réveil suivant reprend :
  #     coverage quasi-continue tant que la directive reste active.
  #   Donc : on ne paie « plein pot » que pendant qu'on a volontairement déployé.
  #   Pour couper net : décocher « Déployer », ou commenter le bloc `schedule`,
  #   ou désactiver ce workflow dans l'onglet Actions. Sur repo PUBLIC, minutes
  #   gratuites ; sur PRIVÉ, ça consomme le quota — ajuster la cadence au besoin.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:            # bouton « Run workflow »
    inputs:
      minutes:
        description: "Durée max du run (minutes, ≤ 330)"
        default: "50"
      mode:
        description: "Mode (vide = directive ; 'backfill' = équipe des 15)"
        default: ""

concurrency:
  group: bot-army
  cancel-in-progress: false

jobs:
  bots:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"      # 22+ = WebSocket natif (requis par le Realtime Supabase)
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Run bot army
        run: node scripts/bot-army.mjs
        env:
          SUPABASE_URL: "https://ikssbshpvpqlcgrbjldz.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Planifié (pas d'input) → 15 min par réveil ; dispatch manuel → l'input.
          BOT_ARMY_MINUTES: ${{ github.event.inputs.minutes || '15' }}
          BOT_ARMY_MODE: ${{ github.event.inputs.mode }}
